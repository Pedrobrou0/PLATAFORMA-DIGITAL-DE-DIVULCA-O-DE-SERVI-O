{% extends 'servicos/base.html' %}


{% block title %}

    Serviços

{% endblock %}


{% block content %}

    <h2>
        Serviços
    </h2>

    <a href="{% url 'criar_servico' %}">
        Novo serviço
    </a>
    
    <form method="get">

        <select name="categoria">
            <option value="">Todas as categorias</option>
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if categoria_selecionada == categoria.id|stringformat:"s" %}selected{% endif %}>
                    {{ categoria.nome }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">
            Filtrar
        </button>

    </form>

    <ul>

        {% for servico in servicos %}

            <li>
                {{ servico.titulo }}

                <a href="{% url 'detalhe_servico' servico.id %}">
                    Detalhar
                </a>
            </li>

        {% empty %}

            <li>
                Nenhum serviço cadastrado.
            </li>

        {% endfor %}

    </ul>

{% endblock %}
