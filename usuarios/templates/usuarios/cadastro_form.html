{% extends 'usuarios/base.html' %}


{% block title %}

    {{ titulo }}

{% endblock %}


{% block content %}

    <h2>
        {{ titulo }}
    </h2>

    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <p>
        Já tem conta?

        <a href="{% url 'login' %}">
            Entrar
        </a>
    </p>

{% endblock %}
